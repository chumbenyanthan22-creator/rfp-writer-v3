<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFP Writer Pro - Generate Proposal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 40px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .navbar .logo i {
            margin-right: 8px;
        }
        .navbar .credits {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #10b981;
            font-weight: 600;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid #334155;
            padding: 32px;
            margin-bottom: 24px;
        }
        .card h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 i {
            color: #818cf8;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border 0.3s;
            outline: none;
        }
        select:focus, textarea:focus {
            border-color: #6366f1;
        }
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        .lang-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 16px 0;
        }
        .lang-chip {
            padding: 6px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-chip:hover {
            border-color: #6366f1;
        }
        .lang-chip.active {
            background: #6366f1;
            border-color: #6366f1;
            color: #fff;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
        }
        .btn-secondary {
            background: #334155;
            color: #f1f5f9;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }
        .output-area {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 24px;
            min-height: 200px;
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
            color: #94a3b8;
            max-height: 400px;
            overflow-y: auto;
        }
        .output-area.has-content {
            color: #f1f5f9;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #334155;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 999;
            animation: slideIn 0.4s ease;
            max-width: 400px;
        }
        .toast-success {
            background: #10b981;
            color: #fff;
        }
        .toast-error {
            background: #ef4444;
            color: #fff;
        }
        .toast-info {
            background: #6366f1;
            color: #fff;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 600px) {
            .navbar { padding: 12px 16px; }
            .container { padding: 20px 16px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo"><i class="fas fa-brain"></i> RFP Writer Pro</div>
        <div class="credits"><i class="fas fa-coins"></i> <span id="creditsDisplay">5</span> Credits</div>
    </nav>

    <div class="container">
        <!-- Main Form -->
        <div class="card">
            <h2><i class="fas fa-magic"></i> Generate Proposal</h2>

            <label>Industry</label>
            <select id="industry">
                <option value="Freight & Logistics">Freight & Logistics</option>
                <option value="Construction">Construction</option>
                <option value="IT Services">IT Services</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Education">Education</option>
                <option value="Energy">Energy</option>
            </select>

            <label style="margin-top:16px;">Language</label>
            <div class="lang-selector" id="langSelector">
                <span class="lang-chip active" data-lang="English">English</span>
                <span class="lang-chip" data-lang="Hindi">Hindi</span>
                <span class="lang-chip" data-lang="Marathi">Marathi</span>
                <span class="lang-chip" data-lang="Tamil">Tamil</span>
                <span class="lang-chip" data-lang="Spanish">Spanish</span>
            </div>

            <label>RFP Content</label>
            <textarea id="rfpContent" placeholder="Paste your RFP content here..."></textarea>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="generateProposal()">
                    <i class="fas fa-brain"></i> Generate with AI
                </button>
                <button class="btn btn-secondary" onclick="clearOutput()">
                    <i class="fas fa-eraser"></i> Clear
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color:#94a3b8;">🧠 Activating 6 AI Agents...</p>
        </div>

        <!-- Output -->
        <div class="card">
            <h2><i class="fas fa-file-alt"></i> Generated Proposal</h2>
            <div class="output-area" id="outputArea">Your AI-generated proposal will appear here...</div>
            <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="copyOutput()"><i class="fas fa-copy"></i> Copy</button>
                <button class="btn btn-secondary" onclick="downloadOutput()"><i class="fas fa-download"></i> Download</button>
            </div>
        </div>
    </div>

    <script>
        // Language selector
        document.querySelectorAll('.lang-chip').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.lang-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Generate proposal
        async function generateProposal() {
            const rfpContent = document.getElementById('rfpContent').value.trim();
            if (!rfpContent) {
                showToast('Please paste RFP content first!', 'error');
                return;
            }

            const industry = document.getElementById('industry').value;
            const language = document.querySelector('.lang-chip.active').dataset.lang;

            document.getElementById('loading').classList.add('active');
            document.getElementById('outputArea').classList.remove('has-content');
            document.getElementById('outputArea').textContent = '🧠 Analyzing RFP with 6 AI agents...';

            try {
                const response = await fetch('/api/proposals/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rfpContent, language, industry })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('outputArea').textContent = data.proposal.content;
                    document.getElementById('outputArea').classList.add('has-content');
                    showToast('✅ Proposal generated successfully!', 'success');
                    // Update credits
                    if (data.creditsRemaining !== undefined) {
                        document.getElementById('creditsDisplay').textContent = data.creditsRemaining;
                    }
                } else {
                    showToast('❌ Failed to generate proposal', 'error');
                }
            } catch (error) {
                showToast('❌ Error: ' + error.message, 'error');
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }

        function clearOutput() {
            document.getElementById('rfpContent').value = '';
            document.getElementById('outputArea').textContent = 'Your AI-generated proposal will appear here...';
            document.getElementById('outputArea').classList.remove('has-content');
        }

        function copyOutput() {
            const text = document.getElementById('outputArea').textContent;
            if (text.includes('Your AI-generated proposal')) {
                showToast('Nothing to copy!', 'info');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Copied to clipboard!', 'success');
            });
        }

        function downloadOutput() {
            const text = document.getElementById('outputArea').textContent;
            if (text.includes('Your AI-generated proposal')) {
                showToast('Nothing to download!', 'info');
                return;
            }
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'rfp-proposal.txt';
            a.click();
            showToast('📥 Downloaded!', 'success');
        }

        function showToast(message, type = 'info') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
