<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFP Writer Pro - AI Proposal Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }
        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        p {
            color: #94a3b8;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.6);
        }
        .btn i {
            margin-right: 10px;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        .feature {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .feature i {
            font-size: 28px;
            color: #818cf8;
            margin-bottom: 10px;
        }
        .feature h3 {
            font-size: 14px;
            font-weight: 600;
        }
        .feature p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 0;
        }
        @media (max-width: 600px) {
            h1 { font-size: 32px; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🧠</div>
        <h1>RFP Writer Pro</h1>
        <p>AI-powered proposal generator with <strong>6 AI Agents</strong> and <strong>Second Brain</strong> technology. Generate winning proposals in <strong>25+ languages</strong>.</p>
        <a href="/app" class="btn"><i class="fas fa-rocket"></i> Launch App</a>

        <div class="features">
            <div class="feature">
                <i class="fas fa-robot"></i>
                <h3>6 AI Agents</h3>
                <p>Compliance, Writer, Pricing & more</p>
            </div>
            <div class="feature">
                <i class="fas fa-brain"></i>
                <h3>Second Brain</h3>
                <p>Neural network visualization</p>
            </div>
            <div class="feature">
                <i class="fas fa-globe"></i>
                <h3>25+ Languages</h3>
                <p>Multi-language support</p>
            </div>
        </div>
    </div>
</body>
</html>
