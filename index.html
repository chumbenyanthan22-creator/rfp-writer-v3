<!DOCTYPE html>

<head>

  <title>RFP Writer Pro</title>
  <script>
    window.location.href = '/app';
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;

      height: 100vh;
      margin: 0;
      background: #0f172a;

    .spinner {
